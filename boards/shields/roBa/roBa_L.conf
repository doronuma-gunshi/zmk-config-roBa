# ----------------------------------------------------
# 1. 基本ハードウェア設定
# ----------------------------------------------------
CONFIG_NFCT_PINS_AS_GPIOS=y
CONFIG_ZMK_BLE=y

# ----------------------------------------------------
# 2. 分割子機 (Peripheral) 動作設定
# ----------------------------------------------------
CONFIG_ZMK_SPLIT=y

# ドングルへ自身のバッテリー残量を報告する
CONFIG_ZMK_BATTERY_REPORTING=y

# 接続の安定化（Bluetooth電波出力を +8dBm に強化）
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
