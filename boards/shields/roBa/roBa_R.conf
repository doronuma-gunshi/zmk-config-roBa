CONFIG_ZMK_KEYBOARD_NAME="roBa"

# トラブル切り分けのため、一時的にポインティング・エンコーダーを無効化
CONFIG_ZMK_POINTING=n
CONFIG_PMW3610=n
CONFIG_EC11=n
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=n

CONFIG_NFCT_PINS_AS_GPIOS=y
CONFIG_ZMK_BLE=y

CONFIG_SPI=n
CONFIG_INPUT=n

CONFIG_ZMK_STUDIO=y
CONFIG_ZMK_STUDIO_LOCKING=n

# 分割子機 (Peripheral) 動作設定
CONFIG_ZMK_SPLIT=y
CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
