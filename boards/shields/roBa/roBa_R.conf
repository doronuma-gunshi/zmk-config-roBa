CONFIG_ZMK_KEYBOARD_NAME="roBa"

CONFIG_ZMK_POINTING=y
CONFIG_NFCT_PINS_AS_GPIOS=y
CONFIG_ZMK_BLE=y

CONFIG_SPI=y
CONFIG_INPUT=y

# ----------------------------------------------------
# トラックボール (PMW3610ドライバを外し、一般インプットとして処理)
# ----------------------------------------------------
CONFIG_PMW3610=n

# ----------------------------------------------------
# ロータリーエンコーダー (EC11) 設定
# ----------------------------------------------------
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# ----------------------------------------------------
# ZMK Studio 設定
# ----------------------------------------------------
CONFIG_ZMK_STUDIO=y
CONFIG_ZMK_STUDIO_LOCKING=n

# ----------------------------------------------------
# 分割子機 (Peripheral) 動作設定
# ----------------------------------------------------
CONFIG_ZMK_SPLIT=y

# ドングルへ自身のバッテリー残量を通知
CONFIG_ZMK_BATTERY_REPORTING=y

# 通信の安定化 (+8dBm)
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
